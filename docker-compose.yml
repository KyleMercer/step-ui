# An explicit project name, rather than the default (derived from whatever
# directory this happens to be run from -- "step-ui" for a plain clone).
# Two reasons: it's what ends up baked into the image as the
# com.docker.compose.project label when building via `docker compose build`
# (e.g. through build.sh), independent of the checkout's directory name; and
# if `docker compose up` were ever run directly from this checkout (it's
# meant for building only -- see build.sh/README), it creates its own
# distinctly-named project/containers/network instead of a bare "step-ui"
# that could be confused with any other checkout or stack.
name: step-ui-build

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - CA_URL=${CA_URL}
      - CA_ROOT_FINGERPRINT=${CA_ROOT_FINGERPRINT:-}
      - PROVISIONER_NAME=${PROVISIONER_NAME}
      - PROVISIONER_PASSWORD=${PROVISIONER_PASSWORD}
      - DB_PATH=/app/data/certs.db
      - PORT=8080
      - STEPPATH=/tmp/step-nonexistent
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:-}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_API_AUTH_TOKEN=${API_AUTH_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
    driver: local
